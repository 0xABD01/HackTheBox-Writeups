# ⚠️ This file belongs in the WRITE-UPS repository, NOT the portfolio repo.
#
# Copy it to:  HackTheBox-Writeups/.github/workflows/trigger-portfolio-deploy.yml
#
# It tells Netlify to rebuild the portfolio whenever you push new write-ups,
# so the site re-syncs and publishes them automatically.
#
# Setup (one time):
#   1. In Netlify:  Site settings → Build & deploy → Build hooks → "Add build hook".
#      Name it e.g. "writeups-update". Copy the generated URL.
#   2. In the WRITE-UPS repo on GitHub:  Settings → Secrets and variables →
#      Actions → "New repository secret".
#        Name:  NETLIFY_BUILD_HOOK
#        Value: <the build hook URL from step 1>
#   3. Commit this file to the write-ups repo. Done.
#
# The hook URL is secret-scoped and never appears in client code or in git.

name: Trigger portfolio deploy

on:
  push:
    branches: [main]

jobs:
  rebuild-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify build hook
        run: curl -fsSL -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
